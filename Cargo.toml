[package]
name = "yamuse2spotify"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "migrate a yandex music library to spotify, downloading whatever spotify does not carry"
readme = "README.md"
publish = false

[dependencies]
# the yandex side.
yamuse = { version = "0.1", default-features = false, features = [
    "rustls-tls",
    "download",
] }

# the spotify side. rustls to match yamuse, `cli` for the browser handoff.
rspotify = { version = "0.16", default-features = false, features = [
    "client-reqwest",
    "reqwest-rustls-tls",
    "cli",
] }

tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "signal", "sync", "time"] }
futures = "0.3"

clap = { version = "4", features = ["derive", "env"] }
inquire = "0.9"
indicatif = "0.18"

# rspotify already pulls chrono in for its own timestamps, so using it for the
# pull timestamp costs nothing. yamuse hand-rolls its two formats instead
# precisely to avoid this dependency — that reasoning does not apply here.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1.3"

strsim = "0.11"
unicode-normalization = "0.1"
lofty = "0.24"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }

thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "6"

# the published 0.1.0 types `Like.id` as a string, but the api sends a number for
# album likes — one mistyped field per element, which exhausts yamuse's repair
# budget and fails `liked_albums` outright on any real library. the fix lives in
# the working copy next door; drop this block once it is released.
[patch.crates-io]
yamuse = { path = "../yamuse" }

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
struct_excessive_bools = "allow"
too_many_arguments = "allow"
doc_markdown = "allow"
