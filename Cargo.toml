[package]
name = "yamuse2spotify"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "migrate a yandex music library to spotify, downloading whatever spotify does not carry"
readme = "README.md"
publish = false

[dependencies]
# the yandex side.
yamuse = { version = "0.2", default-features = false, features = [
    "rustls-tls",
    "download",
] }

# the spotify side.
#
# not rspotify, and not the public web api it speaks to: that api meters by
# application, and the client id this uses — spotify's own, so that nobody has
# to register an app — shares one bucket with every librespot-based tool alive.
# it is permanently spent; `/v1/me` answers 429 on the first request of a run
# and waiting does not help.
#
# librespot's session reaches the internal api instead, which is what the real
# clients use and is not metered anywhere near as tightly: 30 requests with no
# pacing at all come back in ten seconds.
librespot-core = "0.8"
librespot-metadata = "0.8"
# for the batch metadata request: one call for a whole page of search hits
# instead of one per hit.
librespot-protocol = "0.8"
protobuf = "3"

# the oauth dance rspotify used to run: pkce, a loopback listener, and the
# token exchange.
sha2 = "0.10"
base64 = "0.22"
rand = "0.9"
webbrowser = "1"
http = "1"

tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "signal", "sync", "time"] }
futures = "0.3"

clap = { version = "4", features = ["derive", "env"] }
inquire = "0.9"
indicatif = "0.18"

# for the pull timestamp in reports. yamuse hand-rolls its two formats to avoid
# this dependency; here it arrives transitively through librespot anyway.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1.3"

strsim = "0.11"
unicode-normalization = "0.1"
lofty = "0.24"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }

thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "6"

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
struct_excessive_bools = "allow"
too_many_arguments = "allow"
doc_markdown = "allow"
